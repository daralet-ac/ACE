name: docker build

on:
  push:
    branches:
      - "main"

jobs:
  docker:
    runs-on: ubuntu-latest
    env:
      # Secrets are empty on forks (and anywhere they haven't been added), so
      # login and push only happen when both are set; otherwise the image is
      # still built to check that it builds.
      HAS_DOCKERHUB_CREDENTIALS: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        if: env.HAS_DOCKERHUB_CREDENTIALS == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Note skipped push
        if: env.HAS_DOCKERHUB_CREDENTIALS != 'true'
        run: echo "::warning::DOCKERHUB_USERNAME or DOCKERHUB_TOKEN is not set for this repository, so the image will be built but not pushed."

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ env.HAS_DOCKERHUB_CREDENTIALS == 'true' }}
          tags: daralet/ace:latest
