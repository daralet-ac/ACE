name: tests

on:
  pull_request:
  push:
    branches:
      - "main"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The build runs nx-dotnet's module boundary check, which needs node_modules
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Node.js dependencies
        run: npm ci

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # Integration tests need a live MySQL server or the client DAT files, which CI doesn't have
      - name: Server tests
        run: dotnet test apps/server-tests/ACE.Server.Tests.csproj -p:Platform=x64 --filter "TestCategory!=Integration"

      - name: Database tests
        run: dotnet test libs/database-tests/ACE.Database.Tests.csproj -p:Platform=x64 --filter "TestCategory!=Integration"

      - name: DAT loader tests
        run: dotnet test libs/dat-loader-tests/ACE.DatLoader.Tests.csproj -p:Platform=x64 --filter "TestCategory!=Integration"
